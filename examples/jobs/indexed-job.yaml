# Each Pod gets a stable index (0..3) in $JOB_COMPLETION_INDEX and handles one shard.
apiVersion: batch/v1
kind: Job
metadata:
  name: thumbnail-shards
spec:
  completions: 4
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo resizing images in shard $JOB_COMPLETION_INDEX of 4"]
