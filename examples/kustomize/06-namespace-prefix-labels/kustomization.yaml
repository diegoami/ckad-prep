resources:
- deployment.yaml
namespace: bookshop-staging        # set on every resource (the namespace must exist to apply)
namePrefix: staging-
nameSuffix: -v2                    # catalog -> staging-catalog-v2
labels:
- pairs:
    app.kubernetes.io/part-of: bookshop
  includeSelectors: true           # also added to spec.selector and the Pod template
commonAnnotations:
  contact: "#bookshop-oncall"
