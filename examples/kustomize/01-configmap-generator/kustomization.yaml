# Three ways to generate a ConfigMap: from a file, from an env file, from literals.
configMapGenerator:
- name: from-file              # key "application.properties", value = the file's content
  files:
  - application.properties
- name: from-env-file          # one key per line of .env (FOO=Bar)
  envs:
  - .env
- name: from-literals
  literals:
  - FOO=Bar
