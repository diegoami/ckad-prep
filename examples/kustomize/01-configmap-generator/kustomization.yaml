# One ConfigMap per source type. Build it and compare the three `data:` blocks.
configMapGenerator:
- name: shop-settings              # one key, named after the file, holding its whole content
  files:
  - shop.properties
- name: shop-env                   # one key per KEY=value line
  envs:
  - shop.env
- name: shop-theme                 # keys given inline
  literals:
  - THEME=dark
  - BANNER_TEXT=Autumn sale
