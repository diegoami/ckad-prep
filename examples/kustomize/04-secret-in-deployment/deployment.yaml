apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      component: orders-worker
  template:
    metadata:
      labels:
        component: orders-worker
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "echo connecting as $DB_USER; sleep 3600"]
        envFrom:
        - secretRef:
            name: orders-db
