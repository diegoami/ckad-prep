resources:
- service.yaml
- deployment.yaml
namePrefix: dev-
# Copy the Service's final name (after namePrefix) into the app's DB_HOST env var,
# so the two can never drift apart.
replacements:
- source:
    kind: Service
    name: inventory-db
    fieldPath: metadata.name
  targets:
  - select:
      kind: Deployment
      name: inventory-api
    fieldPaths:
    - spec.template.spec.containers.[name=app].env.[name=DB_HOST].value
