# Exposes the Pod's own labels and annotations as files. Change a label with
# `kubectl label pod podinfo-demo tier=frontend --overwrite` and watch the file update.
apiVersion: v1
kind: Pod
metadata:
  name: podinfo-demo
  labels:
    app: podinfo
    tier: backend
  annotations:
    release: "2026-09"
spec:
  containers:
  - name: reader
    image: busybox:1.36
    command: ["sh", "-c", "while true; do cat /etc/podinfo/labels; echo; sleep 10; done"]
    volumeMounts:
    - name: podinfo
      mountPath: /etc/podinfo
  volumes:
  - name: podinfo
    downwardAPI:
      items:
      - path: labels
        fieldRef:
          fieldPath: metadata.labels
      - path: annotations
        fieldRef:
          fieldPath: metadata.annotations
