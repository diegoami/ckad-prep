apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx-p
  name: nginx-p
spec:
  initContainers:
  - image: busybox
    name: busyboxinit
    command: ['sh', '-c', 'echo "Ready" > /shared/status']
    volumeMounts:
    - name: shared-data
      mountPath: /shared
  containers:
  - image: nginx
    name: nginx
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html
  volumes:
  - name: shared-data
    emptyDir: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
